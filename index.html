<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>朋友购物审批局</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background-color: #e8e8e8;
      font-family: 'Courier New', 'SimHei', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* 移动端适配 */
    @media (max-width: 480px) {
      body {
        padding: 1rem 0.5rem;
      }

      .receipt {
        padding: 1.5rem 1rem;
        max-width: 100%;
      }

      .receipt-border {
        padding: 0.6rem;
      }

      .app-header h1 {
        font-size: 1.8rem !important;
      }

      .app-header p {
        font-size: 0.9rem !important;
      }

      .tab-btn {
        padding: 0.4rem 0.8rem;
        font-size: 0.95rem;
      }

      .parse-section {
        padding: 0.8rem;
      }

      .parse-section .flex-row {
        flex-direction: column;
      }

      .parse-btn {
        width: 100%;
        padding: 0.6rem;
      }

      .form-input {
        font-size: 1rem;
      }

      .gen-reason-btn {
        width: 100%;
        padding: 0.5rem;
        text-align: center;
      }

      .submit-btn {
        width: 100%;
        padding: 0.8rem;
      }

      .final-status {
        font-size: 1.5rem;
        padding: 0.8rem;
      }

      .stamp {
        font-size: 2rem;
      }

      .btn-approve, .btn-reject {
        font-size: 1rem !important;
        padding: 0.6rem 0.5rem !important;
      }

      .fill-comment-btn {
        font-size: 0.75rem;
        padding: 0.15rem 0.4rem;
      }

      .comment-textarea {
        font-size: 0.9rem;
        min-height: 40px;
      }

      .court-card {
        padding: 1.5rem 1rem;
        max-width: 90%;
      }

      .court-card h2 {
        font-size: 1.3rem !important;
      }

      .court-reason {
        font-size: 0.95rem;
        padding: 0.6rem;
      }

      .image-preview {
        min-height: 100px;
      }

      #receipt-modal {
        padding: 0.5rem;
        align-items: flex-start;
        padding-top: 2rem;
      }

      #receipt-detail {
        max-height: 85vh !important;
      }
    }

    /* 小屏手机额外适配 */
    @media (max-width: 360px) {
      .receipt {
        padding: 1rem 0.6rem;
      }

      .receipt-border {
        padding: 0.4rem;
      }

      .app-header h1 {
        font-size: 1.5rem !important;
      }
    }

    /* 弹窗内小票字号缩小，防止换行 */
    #receipt-detail .receipt-border {
      font-size: 0.85rem;
    }
    #receipt-detail .text-2xl {
      font-size: 1.2rem !important;
    }
    #receipt-detail .text-xl {
      font-size: 1rem !important;
    }
    #receipt-detail .text-lg {
      font-size: 0.9rem !important;
    }
    #receipt-detail .text-sm {
      font-size: 0.75rem !important;
    }
    #receipt-detail .final-status {
      font-size: 1.2rem !important;
      padding: 0.6rem;
    }
    #receipt-detail .stamp {
      font-size: 1.5rem;
    }
    #receipt-detail .btn-approve,
    #receipt-detail .btn-reject {
      font-size: 0.9rem !important;
      padding: 0.5rem 0.4rem !important;
    }
    #receipt-detail .comment-textarea {
      font-size: 0.8rem;
      min-height: 36px;
    }
    #receipt-detail .fill-comment-btn {
      font-size: 0.7rem;
      padding: 0.1rem 0.3rem;
    }
    #receipt-detail .status-badge {
      font-size: 0.75rem;
      padding: 0.15rem 0.4rem;
    }
    #receipt-detail .court-reason {
      font-size: 0.85rem;
      padding: 0.5rem;
    }

    .app-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .app-header h1 {
      font-size: 2.5rem;
      font-weight: bold;
      letter-spacing: 0.1rem;
    }

    .app-header p {
      color: #666;
      margin-top: 0.5rem;
      font-size: 1.1rem;
    }

    .receipt {
      background: #fff;
      max-width: 400px;
      width: 100%;
      padding: 2rem 1.5rem;
      position: relative;
      box-shadow: 2px 4px 12px rgba(0,0,0,0.15);
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .receipt::before,
    .receipt::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 20px;
      background: radial-gradient(circle, transparent 30%, #fff 30%) repeat-x;
      background-size: 16px 20px;
      z-index: 1;
      pointer-events: none;
    }

    .receipt::before {
      top: -10px;
      background-position: bottom;
    }

    .receipt::after {
      bottom: -10px;
      background-position: top;
    }

    /* 弹窗内的小票不需要锯齿边，避免遮挡内容 */
    #receipt-detail.receipt::before,
    #receipt-detail.receipt::after {
      display: none;
    }

    .receipt-border {
      border: 2px dashed #333;
      padding: 1rem;
    }

    .stamp {
      position: absolute;
      font-size: 2.5rem;
      font-weight: bold;
      transform: rotate(-15deg) scale(0);
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      transition: none;
    }

    .stamp.approved {
      color: #16a34a;
      border: 4px solid #16a34a;
      border-radius: 8px;
      padding: 0.2rem 0.6rem;
      animation: stamp-drop 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    .stamp.rejected {
      color: #dc2626;
      border: 4px solid #dc2626;
      border-radius: 8px;
      padding: 0.2rem 0.6rem;
      animation: stamp-drop 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .shake {
      animation: shake 0.5s ease-in-out;
    }

    @keyframes confetti-fall {
      0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: 0;
      z-index: 100;
      animation: confetti-fall 3s ease-in forwards;
    }

    .btn-approve {
      background: #16a34a;
      color: white;
      transition: all 0.2s;
    }

    .btn-approve:hover {
      background: #15803d;
      transform: scale(1.05);
    }

    .btn-approve:active {
      transform: scale(0.95);
    }

    .btn-reject {
      background: #dc2626;
      color: white;
      transition: all 0.2s;
    }

    .btn-reject:hover {
      background: #b91c1c;
      transform: scale(1.05);
    }

    .btn-reject:active {
      transform: scale(0.95);
    }

    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-approved {
      background: #dcfce7;
      color: #166534;
    }

    .status-rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .form-input {
      background: #f5f5f5;
      border: 1px dashed #999;
      padding: 0.5rem;
      font-family: inherit;
      font-size: 1.1rem;
      width: 100%;
      outline: none;
    }

    .form-input:focus {
      border-color: #333;
      background: #fff;
    }

    .submit-btn {
      background: #333;
      color: #fff;
      padding: 0.6rem 1.5rem;
      font-family: inherit;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .submit-btn:hover {
      background: #000;
      transform: translateY(-2px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .history-item {
      cursor: pointer;
      transition: background 0.2s;
    }

    .history-item:hover {
      background: #f0f0f0;
    }

    .final-status {
      font-size: 2rem;
      text-align: center;
      padding: 1rem;
      margin-top: 1rem;
      border-top: 2px dashed #333;
    }

    .final-status.pass {
      color: #16a34a;
      animation: pulse 1s ease-in-out infinite;
    }

    .final-status.wait {
      color: #92400e;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .tab-btn {
      padding: 0.5rem 1.5rem;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .tab-btn.active {
      border-bottom-color: #333;
      font-weight: bold;
    }

    .tab-btn:hover {
      background: #f0f0f0;
    }

    .gen-reason-btn {
      background: #f59e0b;
      color: #fff;
      border: none;
      padding: 0.3rem 0.8rem;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .gen-reason-btn:hover {
      background: #d97706;
      transform: scale(1.05);
    }

    .comment-textarea {
      background: #f5f5f5;
      border: 1px dashed #999;
      padding: 0.4rem;
      font-family: inherit;
      font-size: 0.95rem;
      width: 100%;
      outline: none;
      resize: vertical;
      min-height: 50px;
    }

    .comment-textarea:focus {
      border-color: #333;
      background: #fff;
    }

    .fill-comment-btn {
      background: #8b5cf6;
      color: #fff;
      border: none;
      padding: 0.2rem 0.6rem;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .fill-comment-btn:hover {
      background: #7c3aed;
    }

    .court-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }

    .court-card {
      background: #fff;
      border: 4px solid #333;
      padding: 2rem;
      max-width: 360px;
      width: 90%;
      text-align: center;
      border-radius: 12px;
      animation: courtBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes courtBounce {
      0% { transform: scale(0) rotate(-10deg); opacity: 0; }
      60% { transform: scale(1.1) rotate(3deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes gavelStrike {
      0% { transform: rotate(0deg); }
      30% { transform: rotate(-45deg); }
      60% { transform: rotate(10deg); }
      100% { transform: rotate(0deg); }
    }

    .gavel {
      font-size: 3rem;
      display: inline-block;
      animation: gavelStrike 0.5s ease-in-out;
    }

    .court-reason {
      background: #fef3c7;
      border: 2px dashed #f59e0b;
      padding: 0.8rem;
      margin-top: 1rem;
      font-size: 1.1rem;
      border-radius: 6px;
    }

    .parse-section {
      background: #f9f9f9;
      border: 2px dashed #666;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 4px;
    }

    .parse-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .parse-btn:hover {
      background: #2563eb;
      transform: scale(1.05);
    }

    .parse-btn:active {
      transform: scale(0.95);
    }

    .image-preview {
      width: 100%;
      min-height: 140px;
      border: 3px dashed #3b82f6;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 0.8rem;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .image-preview:hover {
      border-color: #2563eb;
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      transform: scale(1.02);
    }

    .image-preview.drag-over {
      border-color: #16a34a;
      background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(22, 163, 74, 0.3);
    }

    .image-preview img {
      max-width: 100%;
      max-height: 200px;
      object-fit: contain;
    }

    .image-preview .placeholder {
      color: #3b82f6;
      font-size: 1rem;
      text-align: center;
      padding: 1rem;
      font-weight: 500;
    }

    .image-preview .placeholder .icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 0.5rem;
    }

    .image-preview .placeholder .hint {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 0.3rem;
    }

    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #3b82f6, transparent);
      animation: scan 1.5s ease-in-out;
      z-index: 10;
    }

    @keyframes scan {
      0% { top: 0; opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    /* 扫码枪红色激光线 */
    .scan-laser {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ef4444, transparent);
      box-shadow: 0 0 8px #ef4444;
      animation: scan-laser 0.8s ease-in-out;
      z-index: 10;
    }

    @keyframes scan-laser {
      0% { top: 0; opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .share-btn {
      background: #10b981;
      color: white;
      padding: 0.5rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: bold;
      transition: all 0.3s;
      margin-bottom: 0.5rem;
    }

    .share-btn:hover {
      background: #059669;
      transform: scale(1.05);
    }

    .share-btn:active {
      transform: scale(0.95);
    }

    .share-link-box {
      background: #f3f4f6;
      border: 2px dashed #10b981;
      padding: 0.75rem;
      border-radius: 0.5rem;
      margin-top: 0.5rem;
      word-break: break-all;
      font-size: 0.875rem;
    }

    /* 扫码震动效果 */
    @keyframes scan-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    .scanning {
      animation: scan-shake 0.1s linear 3;
    }

    /* 暴力盖章回弹动画 */
    @keyframes stamp-drop {
      0% { transform: scale(3) rotate(-20deg); opacity: 0; }
      50% { transform: scale(0.9) rotate(5deg); opacity: 1; }
      70% { transform: scale(1.05) rotate(3deg); }
      100% { transform: scale(1) rotate(-5deg); opacity: 1; }
    }

    .stamp-approve {
      animation: stamp-drop 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    /* 撕纸驳回动画 */
    @keyframes tear-paper {
      0% { transform: translateX(0) rotate(0deg); opacity: 1; }
      50% { transform: translateX(-50px) rotate(-5deg); opacity: 0.8; }
      100% { transform: translateX(-100px) rotate(-10deg); opacity: 0; }
    }

    .tear-left {
      animation: tear-paper 0.6s ease-out forwards;
    }

    @keyframes tear-paper-right {
      0% { transform: translateX(0) rotate(0deg); opacity: 1; }
      50% { transform: translateX(50px) rotate(5deg); opacity: 0.8; }
      100% { transform: translateX(100px) rotate(10deg); opacity: 0; }
    }

    .tear-right {
      animation: tear-paper-right 0.6s ease-out forwards;
    }

    /* 热敏打印机吐纸动画 */
    @keyframes print-ticket {
      0% { max-height: 0; opacity: 1; transform: translateY(100%); }
      60% { max-height: 600px; opacity: 1; transform: translateY(0); }
      70% { transform: translateY(0) rotate(2deg); }
      80% { transform: translateY(0) rotate(-2deg); }
      90% { transform: translateY(0) rotate(1deg); }
      100% { max-height: 600px; opacity: 1; transform: translateY(0) rotate(0deg); }
    }

    .ticket-printing {
      overflow: hidden;
      animation: print-ticket 1.5s ease-out forwards;
    }

    /* 页面撞击下沉效果 */
    @keyframes page-impact {
      0% { transform: translateY(0); }
      50% { transform: translateY(5px); }
      100% { transform: translateY(0); }
    }

    .page-impact {
      animation: page-impact 0.3s ease-out;
    }

    /* 布局辅助类 */
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .flex-row { flex-direction: row; }
    .flex-1 { flex: 1; }
    .items-center { align-items: center; }
    .items-start { align-items: flex-start; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .gap-1 { gap: 0.25rem; }
    .gap-2 { gap: 0.5rem; }
    .gap-4 { gap: 1rem; }
    .space-y-2 > * + * { margin-top: 0.5rem; }
    .space-y-4 > * + * { margin-top: 1rem; }
    .text-center { text-align: center; }
    .text-left { text-align: left; }
    .text-right { text-align: right; }
    .text-sm { font-size: 0.875rem; }
    .text-lg { font-size: 1.125rem; }
    .text-xl { font-size: 1.25rem; }
    .text-2xl { font-size: 1.5rem; }
    .text-4xl { font-size: 2.25rem; }
    .font-bold { font-weight: bold; }
    .text-gray-300 { color: #d1d5db; }
    .text-gray-400 { color: #9ca3af; }
    .text-gray-500 { color: #6b7280; }
    .text-gray-600 { color: #4b5563; }
    .text-blue-600 { color: #2563eb; }
    .bg-black { background-color: #000; }
    .bg-opacity-50 { background-color: rgba(0, 0, 0, 0.5); }
    .bg-yellow-50 { background-color: #fefce8; }
    .border-gray-300 { border-color: #d1d5db; }
    .border-yellow-300 { border-color: #fde047; }
    .border-t-2 { border-top: 2px solid; }
    .border-b-2 { border-bottom: 2px solid; }
    .border-dashed { border-style: dashed; }
    .rounded { border-radius: 0.25rem; }
    .hidden { display: none; }
    .fixed { position: fixed; }
    .absolute { position: absolute; }
    .relative { position: relative; }
    .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
    .top-4 { top: 1rem; }
    .right-4 { right: 1rem; }
    .z-50 { z-index: 50; }
    .z-60 { z-index: 60; }
    .p-2 { padding: 0.5rem; }
    .p-3 { padding: 0.75rem; }
    .p-4 { padding: 1rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .mb-1 { margin-bottom: 0.25rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-3 { margin-bottom: 0.75rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mt-1 { margin-top: 0.25rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mt-4 { margin-top: 1rem; }
    .mt-6 { margin-top: 1.5rem; }
    .my-4 { margin-top: 1rem; margin-bottom: 1rem; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .pt-4 { padding-top: 1rem; }
    .pb-2 { padding-bottom: 0.5rem; }
    .overflow-x-auto { overflow-x: auto; }
    .overflow-y-auto { overflow-y: auto; }
    .overflow-visible { overflow: visible; }
    .max-w-lg { max-width: 32rem; }
    .w-full { width: 100%; }
    .underline { text-decoration: underline; }
    .italic { font-style: italic; }
    .cursor-pointer { cursor: pointer; }
    .pointer-events-none { pointer-events: none; }
    .border { border: 1px solid; }
    .block { display: block; }
    .inline-block { display: inline-block; }
  </style>
</head>
<body>
  <div id="app" class="w-full max-w-lg">
    <!-- Header -->
    <div class="app-header mb-6">
      <h1>🧾 朋友购物审批局</h1>
      <p>— 每一笔消费，都值得被审批 —</p>
    </div>

    <!-- Tabs -->
    <div class="flex justify-center gap-4 mb-6 border-b-2 border-gray-300 pb-2">
      <button class="tab-btn active" id="tab-form-btn">📝 提交申请</button>
      <button class="tab-btn" id="tab-history-btn">📋 审批记录</button>
    </div>

    <!-- Form Tab -->
    <div id="form-tab" class="receipt mx-auto">
      <div class="receipt-border">
        <div class="text-center mb-4">
          <p class="text-xl font-bold">═══ 购物审批申请表 ═══</p>
          <p class="text-sm text-gray-500">No. <span id="receipt-no">000001</span></p>
        </div>

        <form id="approval-form">
          <!-- URL Parse Section -->
          <div class="parse-section">
            <label class="block mb-2 text-lg font-bold">🔗 粘贴商品链接</label>
            <div class="flex gap-2 flex-row">
              <input type="text" id="product-url" class="form-input flex-1" placeholder="例：https://example.com?title=奶茶&price=25&img=..." />
              <button type="button" class="parse-btn" id="parse-btn">📡 一键解析</button>
            </div>
            <div class="image-preview" id="image-preview">
              <div class="placeholder">
                <span class="icon">📸</span>
                <div>拖拽商品图片到这里</div>
                <div class="hint">支持从淘宝、拼多多直接拖入</div>
              </div>
            </div>
          </div>

          <div class="mb-4">
            <label class="block mb-1 text-lg">📦 商品名称</label>
            <input type="text" id="product-name" class="form-input" placeholder="例：一杯奶茶" required />
          </div>

          <div class="mb-4">
            <label class="block mb-1 text-lg">💰 金额（元）</label>
            <input type="number" id="amount" class="form-input" placeholder="例：25" min="0.01" step="0.01" required />
          </div>

          <div class="mb-4">
            <label class="block mb-1 text-lg">📝 购买理由</label>
            <div class="flex gap-2 mb-2">
              <button type="button" class="gen-reason-btn" id="gen-reason-btn">🎭 生成戏精理由</button>
            </div>
            <textarea id="reason" class="form-input" rows="3" placeholder="例：今天心情不好，需要糖分安慰" required></textarea>
          </div>

          <div class="text-center">
            <button type="submit" class="submit-btn">🖨️ 打印申请表</button>
          </div>
        </form>
      </div>
    </div>

    <!-- History Tab -->
    <div id="history-tab" class="hidden">
      <div id="history-list" class="space-y-4">
        <p class="text-center text-gray-500">暂无审批记录</p>
      </div>
    </div>

    <!-- Receipt Detail Modal -->
    <div id="receipt-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
      <div id="receipt-detail" class="receipt mx-auto relative" style="max-height: 85vh; overflow-y: auto;">
        <!-- Dynamic content -->
      </div>
    </div>
  </div>

  <!-- Close button outside #app to avoid any container clipping -->
  <button id="close-modal-btn" style="display: none; position: fixed; top: 86px; right: 56px; z-index: 99999; background: #fff; border-radius: 50%; width: 18px; height: 18px; line-height: 18px; text-align: center; border: 1px solid #333; font-size: 11px; font-weight: bold; color: #333; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.3);">&times;</button>

  <script src="./app.js"></script>
</body>
</html>
