<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>朋友购物审批局</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    body {
      background-color: #e8e8e8;
      font-family: 'VT323', 'Courier New', 'SimHei', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      -webkit-tap-highlight-color: transparent;
    }

    /* 移动端适配 */
    @media (max-width: 480px) {
      body {
        padding: 1rem 0.5rem;
      }

      .receipt {
        padding: 1.5rem 1rem;
        max-width: 100%;
      }

      .receipt-border {
        padding: 0.6rem;
      }

      #app > .text-center.mb-6 > h1 {
        font-size: 1.8rem !important;
      }

      #app > .text-center.mb-6 > p {
        font-size: 0.9rem !important;
      }

      .tab-btn {
        padding: 0.4rem 0.8rem;
        font-size: 0.95rem;
      }

      .parse-section {
        padding: 0.8rem;
      }

      .parse-section .flex {
        flex-direction: column;
      }

      .parse-btn {
        width: 100%;
        padding: 0.6rem;
      }

      .form-input {
        font-size: 1rem;
      }

      .gen-reason-btn {
        width: 100%;
        padding: 0.5rem;
        text-align: center;
      }

      .submit-btn {
        width: 100%;
        padding: 0.8rem;
      }

      .final-status {
        font-size: 1.5rem;
        padding: 0.8rem;
      }

      .stamp {
        font-size: 2rem;
      }

      .btn-approve, .btn-reject {
        font-size: 1rem !important;
        padding: 0.6rem 0.5rem !important;
      }

      .fill-comment-btn {
        font-size: 0.75rem;
        padding: 0.15rem 0.4rem;
      }

      .comment-textarea {
        font-size: 0.9rem;
        min-height: 40px;
      }

      .court-card {
        padding: 1.5rem 1rem;
        max-width: 90%;
      }

      .court-card h2 {
        font-size: 1.3rem !important;
      }

      .court-reason {
        font-size: 0.95rem;
        padding: 0.6rem;
      }

      .image-preview {
        min-height: 100px;
      }

      #receipt-modal {
        padding: 0.5rem;
        align-items: flex-start;
        padding-top: 2rem;
      }

      #receipt-detail {
        max-height: 85vh !important;
      }
    }

    /* 小屏手机额外适配 */
    @media (max-width: 360px) {
      .receipt {
        padding: 1rem 0.6rem;
      }

      .receipt-border {
        padding: 0.4rem;
      }

      #app > .text-center.mb-6 > h1 {
        font-size: 1.5rem !important;
      }
    }

    .receipt {
      background: #fff;
      max-width: 400px;
      width: 100%;
      padding: 2rem 1.5rem;
      position: relative;
      box-shadow: 2px 4px 12px rgba(0,0,0,0.15);
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .receipt::before,
    .receipt::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 20px;
      background: radial-gradient(circle, transparent 30%, #fff 30%) repeat-x;
      background-size: 16px 20px;
      z-index: 1;
      pointer-events: none;
    }

    .receipt::before {
      top: -10px;
      background-position: bottom;
    }

    .receipt::after {
      bottom: -10px;
      background-position: top;
    }

    /* 弹窗内的小票不需要锯齿边，避免遮挡内容 */
    #receipt-detail.receipt::before,
    #receipt-detail.receipt::after {
      display: none;
    }

    .receipt-border {
      border: 2px dashed #333;
      padding: 1rem;
    }

    .stamp {
      position: absolute;
      font-size: 2.5rem;
      font-weight: bold;
      transform: rotate(-15deg) scale(0);
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      transition: none;
    }

    .stamp.approved {
      color: #16a34a;
      border: 4px solid #16a34a;
      border-radius: 8px;
      padding: 0.2rem 0.6rem;
      animation: stamp-drop 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    .stamp.rejected {
      color: #dc2626;
      border: 4px solid #dc2626;
      border-radius: 8px;
      padding: 0.2rem 0.6rem;
      animation: stamp-drop 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .shake {
      animation: shake 0.5s ease-in-out;
    }

    @keyframes confetti-fall {
      0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: 0;
      z-index: 100;
      animation: confetti-fall 3s ease-in forwards;
    }

    .btn-approve {
      background: #16a34a;
      color: white;
      transition: all 0.2s;
    }

    .btn-approve:hover {
      background: #15803d;
      transform: scale(1.05);
    }

    .btn-approve:active {
      transform: scale(0.95);
    }

    .btn-reject {
      background: #dc2626;
      color: white;
      transition: all 0.2s;
    }

    .btn-reject:hover {
      background: #b91c1c;
      transform: scale(1.05);
    }

    .btn-reject:active {
      transform: scale(0.95);
    }

    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-approved {
      background: #dcfce7;
      color: #166534;
    }

    .status-rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .form-input {
      background: #f5f5f5;
      border: 1px dashed #999;
      padding: 0.5rem;
      font-family: inherit;
      font-size: 1.1rem;
      width: 100%;
      outline: none;
    }

    .form-input:focus {
      border-color: #333;
      background: #fff;
    }

    .submit-btn {
      background: #333;
      color: #fff;
      padding: 0.6rem 1.5rem;
      font-family: inherit;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .submit-btn:hover {
      background: #000;
      transform: translateY(-2px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .history-item {
      cursor: pointer;
      transition: background 0.2s;
    }

    .history-item:hover {
      background: #f0f0f0;
    }

    .final-status {
      font-size: 2rem;
      text-align: center;
      padding: 1rem;
      margin-top: 1rem;
      border-top: 2px dashed #333;
    }

    .final-status.pass {
      color: #16a34a;
      animation: pulse 1s ease-in-out infinite;
    }

    .final-status.wait {
      color: #92400e;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .tab-btn {
      padding: 0.5rem 1.5rem;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .tab-btn.active {
      border-bottom-color: #333;
      font-weight: bold;
    }

    .tab-btn:hover {
      background: #f0f0f0;
    }

    .gen-reason-btn {
      background: #f59e0b;
      color: #fff;
      border: none;
      padding: 0.3rem 0.8rem;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .gen-reason-btn:hover {
      background: #d97706;
      transform: scale(1.05);
    }

    .comment-textarea {
      background: #f5f5f5;
      border: 1px dashed #999;
      padding: 0.4rem;
      font-family: inherit;
      font-size: 0.95rem;
      width: 100%;
      outline: none;
      resize: vertical;
      min-height: 50px;
    }

    .comment-textarea:focus {
      border-color: #333;
      background: #fff;
    }

    .fill-comment-btn {
      background: #8b5cf6;
      color: #fff;
      border: none;
      padding: 0.2rem 0.6rem;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .fill-comment-btn:hover {
      background: #7c3aed;
    }

    .court-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }

    .court-card {
      background: #fff;
      border: 4px solid #333;
      padding: 2rem;
      max-width: 360px;
      width: 90%;
      text-align: center;
      border-radius: 12px;
      animation: courtBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes courtBounce {
      0% { transform: scale(0) rotate(-10deg); opacity: 0; }
      60% { transform: scale(1.1) rotate(3deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes gavelStrike {
      0% { transform: rotate(0deg); }
      30% { transform: rotate(-45deg); }
      60% { transform: rotate(10deg); }
      100% { transform: rotate(0deg); }
    }

    .gavel {
      font-size: 3rem;
      display: inline-block;
      animation: gavelStrike 0.5s ease-in-out;
    }

    .court-reason {
      background: #fef3c7;
      border: 2px dashed #f59e0b;
      padding: 0.8rem;
      margin-top: 1rem;
      font-size: 1.1rem;
      border-radius: 6px;
    }

    .parse-section {
      background: #f9f9f9;
      border: 2px dashed #666;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 4px;
    }

    .parse-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .parse-btn:hover {
      background: #2563eb;
      transform: scale(1.05);
    }

    .parse-btn:active {
      transform: scale(0.95);
    }

    .image-preview {
      width: 100%;
      min-height: 140px;
      border: 3px dashed #3b82f6;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 0.8rem;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .image-preview:hover {
      border-color: #2563eb;
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      transform: scale(1.02);
    }

    .image-preview.drag-over {
      border-color: #16a34a;
      background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(22, 163, 74, 0.3);
    }

    .image-preview img {
      max-width: 100%;
      max-height: 200px;
      object-fit: contain;
    }

    .image-preview .placeholder {
      color: #3b82f6;
      font-size: 1rem;
      text-align: center;
      padding: 1rem;
      font-weight: 500;
    }

    .image-preview .placeholder .icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 0.5rem;
    }

    .image-preview .placeholder .hint {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 0.3rem;
    }

    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #3b82f6, transparent);
      animation: scan 1.5s ease-in-out;
      z-index: 10;
    }

    @keyframes scan {
      0% { top: 0; opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    /* 扫码枪红色激光线 */
    .scan-laser {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ef4444, transparent);
      box-shadow: 0 0 8px #ef4444;
      animation: scan-laser 0.8s ease-in-out;
      z-index: 10;
    }

    @keyframes scan-laser {
      0% { top: 0; opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .share-btn {
      background: #10b981;
      color: white;
      padding: 0.5rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: bold;
      transition: all 0.3s;
      margin-bottom: 0.5rem;
    }

    .share-btn:hover {
      background: #059669;
      transform: scale(1.05);
    }

    .share-btn:active {
      transform: scale(0.95);
    }

    .share-link-box {
      background: #f3f4f6;
      border: 2px dashed #10b981;
      padding: 0.75rem;
      border-radius: 0.5rem;
      margin-top: 0.5rem;
      word-break: break-all;
      font-size: 0.875rem;
    }

    /* 扫码震动效果 */
    @keyframes scan-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    .scanning {
      animation: scan-shake 0.1s linear 3;
    }

    /* 暴力盖章回弹动画 */
    @keyframes stamp-drop {
      0% { transform: scale(3) rotate(-20deg); opacity: 0; }
      50% { transform: scale(0.9) rotate(5deg); opacity: 1; }
      70% { transform: scale(1.05) rotate(3deg); }
      100% { transform: scale(1) rotate(-5deg); opacity: 1; }
    }

    .stamp-approve {
      animation: stamp-drop 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    /* 撕纸驳回动画 */
    @keyframes tear-paper {
      0% { transform: translateX(0) rotate(0deg); opacity: 1; }
      50% { transform: translateX(-50px) rotate(-5deg); opacity: 0.8; }
      100% { transform: translateX(-100px) rotate(-10deg); opacity: 0; }
    }

    .tear-left {
      animation: tear-paper 0.6s ease-out forwards;
    }

    @keyframes tear-paper-right {
      0% { transform: translateX(0) rotate(0deg); opacity: 1; }
      50% { transform: translateX(50px) rotate(5deg); opacity: 0.8; }
      100% { transform: translateX(100px) rotate(10deg); opacity: 0; }
    }

    .tear-right {
      animation: tear-paper-right 0.6s ease-out forwards;
    }

    /* 热敏打印机吐纸动画 */
    @keyframes print-ticket {
      0% { max-height: 0; opacity: 1; transform: translateY(100%); }
      60% { max-height: 600px; opacity: 1; transform: translateY(0); }
      70% { transform: translateY(0) rotate(2deg); }
      80% { transform: translateY(0) rotate(-2deg); }
      90% { transform: translateY(0) rotate(1deg); }
      100% { max-height: 600px; opacity: 1; transform: translateY(0) rotate(0deg); }
    }

    .ticket-printing {
      overflow: hidden;
      animation: print-ticket 1.5s ease-out forwards;
    }

    /* 页面撞击下沉效果 */
    @keyframes page-impact {
      0% { transform: translateY(0); }
      50% { transform: translateY(5px); }
      100% { transform: translateY(0); }
    }

    .page-impact {
      animation: page-impact 0.3s ease-out;
    }
  </style>
</head>
<body>
  <div id="app" class="w-full max-w-lg">
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-4xl font-bold tracking-wider" style="font-family: 'VT323', monospace;">🧾 朋友购物审批局</h1>
      <p class="text-gray-500 mt-2" style="font-size: 1.1rem;">— 每一笔消费，都值得被审批 —</p>
    </div>

    <!-- Tabs -->
    <div class="flex justify-center gap-4 mb-6 border-b-2 border-gray-300 pb-2">
      <button class="tab-btn active" onclick="switchTab('form')">📝 提交申请</button>
      <button class="tab-btn" onclick="switchTab('history')">📋 审批记录</button>
    </div>

    <!-- Form Tab -->
    <div id="form-tab" class="receipt mx-auto">
      <div class="receipt-border">
        <div class="text-center mb-4">
          <p class="text-xl font-bold">═══ 购物审批申请表 ═══</p>
          <p class="text-sm text-gray-500">No. <span id="receipt-no">000001</span></p>
        </div>

        <form id="approval-form" onsubmit="submitForm(event)">
          <div class="mb-4">
            <label class="block mb-1 text-lg">📦 商品名称</label>
            <input type="text" id="product-name" class="form-input" placeholder="例：一杯奶茶" required />
          </div>

          <!-- 图片上传（非必填） -->
          <div class="mb-4">
            <label class="block mb-1 text-lg">📷 商品图片（可选）</label>
            <input type="file" id="product-image" class="form-input" accept="image/*" style="padding: 0.5rem;" />
            <div id="image-upload-preview" style="display:none; margin-top:0.5rem;">
              <img id="preview-img" style="max-width:100%; max-height:200px; border-radius:4px;" />
            </div>
          </div>

          <div class="mb-4">
            <label class="block mb-1 text-lg">💰 金额（元）</label>
            <input type="number" id="amount" class="form-input" placeholder="例：25" min="0.01" step="0.01" required />
          </div>

          <div class="mb-4">
            <label class="block mb-1 text-lg">📝 购买理由</label>
            <div class="flex gap-2 mb-2">
              <button type="button" class="gen-reason-btn" onclick="generateReason()">🎭 生成戏精理由</button>
            </div>
            <textarea id="reason" class="form-input" rows="3" placeholder="例：今天心情不好，需要糖分安慰" required></textarea>
          </div>

          <div class="text-center">
            <button type="submit" class="submit-btn">🖨️ 打印申请表</button>
          </div>
        </form>
      </div>
    </div>

    <!-- History Tab -->
    <div id="history-tab" class="hidden">
      <div id="history-list" class="space-y-4">
        <p class="text-center text-gray-500">暂无审批记录</p>
      </div>
    </div>

    <!-- Receipt Detail Modal -->
    <div id="receipt-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
      <div id="receipt-detail" class="receipt mx-auto relative overflow-visible" style="max-height: 90vh; overflow-y: auto;">
        <!-- Dynamic content -->
      </div>
      <button onclick="closeModal()" class="absolute top-4 right-4 text-white text-3xl font-bold hover:text-gray-300" style="z-index: 60;">&times;</button>
    </div>
  </div>

  <script>
    // ===== Supabase 配置管理 =====
    let sbClient = null;

    function getSupabaseConfig() {
      // 优先使用 config.js 中的配置（如果不是默认占位符）
      if (typeof SUPABASE_CONFIG !== 'undefined' && 
          SUPABASE_CONFIG.SUPABASE_URL && 
          SUPABASE_CONFIG.SUPABASE_URL !== 'https://your-project-id.supabase.co' &&
          SUPABASE_CONFIG.SUPABASE_ANON_KEY && 
          SUPABASE_CONFIG.SUPABASE_ANON_KEY !== 'your-anon-key-here') {
        return { url: SUPABASE_CONFIG.SUPABASE_URL, key: SUPABASE_CONFIG.SUPABASE_ANON_KEY };
      }
      
      // 其次使用 localStorage 中的配置
      const saved = localStorage.getItem('supabase_config');
      if (saved) {
        try { return JSON.parse(saved); } catch(e) { return null; }
      }
      return null;
    }

    function saveSupabaseConfig(url, key) {
      localStorage.setItem('supabase_config', JSON.stringify({ url, key }));
    }

    function initSupabase(url, key) {
      try {
        if (!window.supabase || !window.supabase.createClient) {
          console.warn('Supabase SDK 未加载，云端功能不可用');
          return false;
        }
        sbClient = window.supabase.createClient(url, key);
        return true;
      } catch(e) {
        console.error('Supabase 初始化失败:', e);
        return false;
      }
    }

    function showConfigPanel() {
      const config = getSupabaseConfig();
      document.getElementById('app').innerHTML = `
        <div class="text-center mb-6">
          <h1 class="text-4xl font-bold tracking-wider" style="font-family: 'VT323', monospace;">🧾 朋友购物审批局</h1>
          <p class="text-gray-500 mt-2" style="font-size: 1.1rem;">— 每一笔消费，都值得被审批 —</p>
        </div>
        <div class="receipt mx-auto">
          <div class="receipt-border">
            <div class="text-center mb-4">
              <p class="text-2xl font-bold">⚙️ 云端配置</p>
              <p class="text-sm text-gray-500 mt-2">首次使用需配置 Supabase 云端数据库</p>
            </div>
            <div class="mb-4">
              <label class="block mb-1 text-lg">🔗 Supabase URL</label>
              <input type="text" id="config-url" class="form-input" placeholder="https://xxx.supabase.co" value="${config?.url || ''}" />
            </div>
            <div class="mb-4">
              <label class="block mb-1 text-lg">🔑 Supabase Anon Key</label>

    // ===== Audio Context for Sound Effects =====
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new AudioCtx();
      return audioCtx;
    }

    function playStampSound() {
      const ctx = getAudioCtx();
      // 夸张的"砰"声 - 从高到低的滑音
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.type = 'sawtooth';
      osc1.frequency.setValueAtTime(800, ctx.currentTime);
      osc1.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.1);
      gain1.gain.setValueAtTime(0.6, ctx.currentTime);
      gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
      osc1.start(ctx.currentTime);
      osc1.stop(ctx.currentTime + 0.15);

      // 加一个"boing"回弹音
      setTimeout(() => {
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(200, ctx.currentTime);
        osc2.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.05);
        osc2.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.1);
        gain2.gain.setValueAtTime(0.4, ctx.currentTime);
        gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc2.start(ctx.currentTime);
        osc2.stop(ctx.currentTime + 0.15);
      }, 80);
    }

    function playRejectSound() {
      const ctx = getAudioCtx();
      // 卡通"哇哇"失败音 -  descending slide
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(600, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
      osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.4);
      gain.gain.setValueAtTime(0.4, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.4);

      // 加一个"wah wah"颤音
      setTimeout(() => {
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(300, ctx.currentTime);
        osc2.frequency.setValueAtTime(280, ctx.currentTime + 0.1);
        osc2.frequency.setValueAtTime(260, ctx.currentTime + 0.2);
        gain2.gain.setValueAtTime(0.3, ctx.currentTime);
        gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc2.start(ctx.currentTime);
        osc2.stop(ctx.currentTime + 0.3);
      }, 150);
    }

    function playSuccessSound() {
      const ctx = getAudioCtx();
      // 卡通胜利号角 - 夸张的上行滑音 + 和弦
      const notes = [523, 659, 784, 1047, 1318]; // C5, E5, G5, C6, E6
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
        gain.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.3);
        osc.start(ctx.currentTime + i * 0.1);
        osc.stop(ctx.currentTime + i * 0.1 + 0.3);
      });

      // 加一个"叮叮叮"的钟声
      setTimeout(() => {
        [2093, 2637, 3136].forEach((freq, i) => { // C7, E7, G7
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.08);
          gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.08 + 0.5);
          osc.start(ctx.currentTime + i * 0.08);
          osc.stop(ctx.currentTime + i * 0.08 + 0.5);
        });
      }, 400);
    }

    // ===== Canvas 金币/撒花效果 =====
    function spawnCanvasCoins(amount) {
      const canvas = document.createElement('canvas');
      canvas.style.position = 'fixed';
      canvas.style.top = '0';
      canvas.style.left = '0';
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      canvas.style.pointerEvents = 'none';
      canvas.style.zIndex = '1000';
      document.body.appendChild(canvas);

      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const coins = [];
      const coinCount = Math.min(Math.floor(amount / 10), 30); // 金额越大金币越多，最多30个

      for (let i = 0; i < coinCount; i++) {
        coins.push({
          x: Math.random() * canvas.width,
          y: -50,
          vx: (Math.random() - 0.5) * 3,
          vy: Math.random() * 3 + 2,
          rotation: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 0.2,
          size: Math.random() * 15 + 10
        });
      }

      let frame = 0;
      const maxFrames = 180; // 3秒

      function animate() {
        if (frame >= maxFrames) {
          document.body.removeChild(canvas);
          return;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        coins.forEach(coin => {
          coin.x += coin.vx;
          coin.y += coin.vy;
          coin.vy += 0.1; // 重力
          coin.rotation += coin.rotationSpeed;

          ctx.save();
          ctx.translate(coin.x, coin.y);
          ctx.rotate(coin.rotation);

          // 绘制金币
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          ctx.arc(0, 0, coin.size, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.arc(0, 0, coin.size * 0.7, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fbbf24';
          ctx.font = `bold ${coin.size}px Arial`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('¥', 0, 0);

          ctx.restore();
        });

        frame++;
        requestAnimationFrame(animate);
      }

      animate();
    }

    function playScanSound() {

    // 收银机"叮"声
    function playCashRegisterSound() {

    // 撕纸声
    function playTearSound() {
      const ctx = getAudioCtx();
      // 卡通撕纸声 - 快速下降的噪音
      const bufferSize = ctx.sampleRate * 0.4;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      }
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(3000, ctx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(500, ctx.currentTime + 0.3);
      source.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.5, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      source.start(ctx.currentTime);
    }

    // 打印机齿轮声
    function playPrinterSound() {
      const ctx = getAudioCtx();
      // 卡通打印机声 - 夸张的"滋滋滋"齿轮转动
      for (let i = 0; i < 8; i++) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100 + Math.random() * 80, ctx.currentTime + i * 0.1);
        gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.08);
        osc.start(ctx.currentTime + i * 0.1);
        osc.stop(ctx.currentTime + i * 0.1 + 0.08);
      }

      // 加一个"叮"的完成音
      setTimeout(() => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1500, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.3);
      }, 800);
    }

    function parseProductUrl() {
      const urlInput = document.getElementById('product-url');
      const url = urlInput.value.trim();
      const parseSection = document.querySelector('.parse-section');

      if (!url) {
        alert('请先粘贴商品链接');
        return;
      }

      // Add red laser scan animation
      const laser = document.createElement('div');
      laser.className = 'scan-laser';
      parseSection.style.position = 'relative';
      parseSection.appendChild(laser);

      try {
        // Try to parse URL
        const urlObj = new URL(url);
        const params = new URLSearchParams(urlObj.search);

        // Extract parameters
        const title = params.get('title') || params.get('name') || params.get('product');
        const price = params.get('price') || params.get('amount') || params.get('cost');
        const img = params.get('img') || params.get('image') || params.get('pic');

        let parsed = false;

        // Fill product name
        if (title) {
          document.getElementById('product-name').value = title;
          parsed = true;
        }

        // Fill price
        if (price) {
          document.getElementById('amount').value = parseFloat(price);
          parsed = true;
        }

        // Show image preview
        if (img) {
          showImagePreview(img);
          parsed = true;
        }

        // Play scan sound and show scan line animation
        if (parsed) {
          playScanSound();
          showScanAnimation();
          
          // Add scanning shake effect after laser finishes
          setTimeout(() => {
            parseSection.classList.add('scanning');
            setTimeout(() => parseSection.classList.remove('scanning'), 300);
          }, 800);
        } else {
          setTimeout(() => laser.remove(), 800);
          alert('未能从链接中解析到商品信息，请手动填写');
        }
      } catch (e) {
        setTimeout(() => laser.remove(), 800);
        alert('链接格式不正确，请输入完整的URL');
      }
    }

      });

      preview.addEventListener('dragleave', (e) => {

        preview.classList.remove('drag-over');
      });

      preview.addEventListener('drop', (e) => {
        e.preventDefault();
        preview.classList.remove('drag-over');

        const files = e.dataTransfer.files;
        if (files.length > 0) {
          const file = files[0];
          if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (event) => {
              showImagePreview(event.target.result);
              playScanSound();
              showScanAnimation();
            };
            reader.readAsDataURL(file);
          } else {

          }
        }
      });
    }

    // ===== Court Logic =====
    function judgeResult(approvals, rejections) {
      // 2人都同意
      if (approvals.length >= 2) return { status: 'approved', reason: '全票通过！恭喜获得合法剁手权！' };

      // 2人都驳回
      if (rejections.length >= 2) return { status: 'rejected', reason: '全票驳回！你的钱包保住了！' };

      // 1同意 1驳回 -> 触发小法庭！
      if (approvals.length === 1 && rejections.length === 1) {
        const isApproved = Math.random() > 0.5; // 50% 概率
        const courtReasons = isApproved
          ? ['小法庭判定：虽然有点贵，但看着可怜，准了！', '法官敲下法槌：今天天气不错，适合花钱，通过！']
          : ['小法庭判定：驳回！买这个不如把钱存起来买排骨。', '法官表示：你的理由太牵强了，驳回！'];

        return {
          status: isApproved ? 'approved' : 'rejected',
          reason: courtReasons[Math.floor(Math.random() * courtReasons.length)],
          isCourt: true // 标记这是小法庭的结果
        };
      }

      return { status: 'pending', reason: '等待另一位法官到场...' };
    }

    // ===== Form Submission =====
    async function submitForm(e) {
      e.preventDefault();
      const name = document.getElementById('product-name').value.trim();
      const amount = parseFloat(document.getElementById('amount').value);
      const reason = document.getElementById('reason').value.trim();

      if (!name || !amount || !reason) return;

      const requiredApprovals = amount > 50 ? 2 : 1;
      const record = {
        id: Date.now(),
        no: getNextNo(),
        name,
        amount,
        reason,
        image: parsedImageData || null,
        required_approvals: requiredApprovals,
        approvals: {
          A: { status: 'pending', label: '朋友A' },
          B: requiredApprovals === 2 ? { status: 'pending', label: '朋友B' } : { status: 'ignored', label: '朋友B（无需审批）' }
        },
        created_at: new Date().toISOString(),
        createdAt: new Date().toLocaleString('zh-CN')
      };

      // 保存到本地
      const records = getRecords();
      records.unshift(record);
      saveRecords(records);

      // 上传到云端（不传 id 和 createdAt 字段，让 Supabase 自动生成）
      const cloudRecord = { ...record };
      delete cloudRecord.id;
      delete cloudRecord.createdAt;
      const cloudId = await uploadRecord(cloudRecord);
      if (cloudId) {
        record.cloudId = cloudId;
        saveRecords(records); // 保存 cloudId
      }

      document.getElementById('approval-form').reset();
      // 重置图片上传
      parsedImageData = null;
      const preview = document.getElementById('image-upload-preview');
      if (preview) preview.style.display = 'none';
      document.getElementById('receipt-no').textContent = getNextNo();

      // Play printer sound and show ticket-printing animation
      playPrinterSound();
      switchTab('history');

      // Apply ticket-printing animation to the newly created history item
      setTimeout(() => {
        const firstItem = document.querySelector('#history-list .receipt');
        if (firstItem) {
          firstItem.classList.add('ticket-printing');
          firstItem.addEventListener('animationend', () => {
            firstItem.classList.remove('ticket-printing');
          }, { once: true });
        }
      }, 50);

      // 提交后直接弹出分享链接，不打开审批小票
      setTimeout(() => {
        window.scrollTo(0, 0);
        if (record.cloudId) {
          shareRecord(record.cloudId);
        }
      }, 1600);
    }

        container.innerHTML = '<p class="text-center text-gray-500">暂无审批记录</p>';

      container.innerHTML = records.map(r => {
        const status = getOverallStatus(r);
        const statusClass = status === 'approved' ? 'status-approved' : status === 'rejected' ? 'status-rejected' : 'status-pending';
        const statusText = status === 'approved' ? '✅ 已通过' : status === 'rejected' ? '❌ 已驳回' : '⏳ 审批中';
        return `
          <div class="receipt history-item" onclick="showReceiptDetail(${r.id})">

                <div>

                  <div class="flex gap-1 mb-1 items-center">
                    <span class="text-sm text-gray-500">审批意见（可选）：</span>
                    <button type="button" class="fill-comment-btn" onclick="fillComment(${record.id}, 'B', 'approve')">🎲 随机批准语</button>
                    <button type="button" class="fill-comment-btn" style="background:#ef4444" onclick="fillComment(${record.id}, 'B', 'reject')">🎲 随机驳回语</button>
                  </div>
                  <textarea id="comment-B" class="comment-textarea" rows="2" placeholder="写点什么审批意见吧..."></textarea>
                </div>
                <div class="flex gap-2">
                  <button class="btn-approve flex-1 py-2 text-lg" onclick="submitApproval(${record.id}, 'B', 'approved')">✅ 批准</button>
                  <button class="btn-reject flex-1 py-2 text-lg" onclick="submitApproval(${record.id}, 'B', 'rejected')">❌ 驳回</button>
                </div>
              ` : `
                <div class="text-center py-2 relative">
                  <span class="status-badge ${bStatus === 'approved' ? 'status-approved' : 'status-rejected'} text-lg">
                    ${bStatus === 'approved' ? '✅ 已批准' : '❌ 已驳回'}
                  </span>
                  <div class="stamp ${bStatus === 'approved' ? 'approved' : 'rejected'}" style="top: -10px; right: 20px;">
                    ${bStatus === 'approved' ? '准' : '驳'}
                  </div>
                  ${record.approvals.B.comment ? `<p class="text-sm text-gray-600 mt-2 italic">"${escapeHtml(record.approvals.B.comment)}"</p>` : ''}
                </div>
              `}
            </div>
          </div>

          <!-- Court Result (if triggered) -->
          ${record.courtResult ? `
            <div class="border-t-2 border-dashed border-gray-300 my-4 pt-4">
              <p class="text-center text-lg font-bold mb-2">⚖️ 小法庭判决书</p>
              <div class="court-reason">
                <p>${escapeHtml(record.courtResult.reason)}</p>
              </div>
            </div>
          ` : ''}

          <!-- Final Status -->
          <div class="final-status ${status === 'approved' ? 'pass' : (status === 'rejected' ? 'wait' : 'wait')}" ${status === 'rejected' ? 'style="color:#dc2626"' : ''}>
            ${status === 'approved' ? '✅ 审批通过，去买吧！' : status === 'rejected' ? '❌ 审批被驳回，省钱了！' : '⏳ 等待审批中'}
          </div>

          <!-- Share Button -->
          ${record.cloudId ? `
            <div class="text-center mt-4 pt-4 border-t-2 border-dashed border-gray-300">
              <button class="share-btn" onclick="shareRecord('${record.cloudId}')">📤 分享给朋友审批</button>
              <p class="text-xs text-gray-400 mt-2">生成链接后，朋友打开即可填写审批意见</p>
            </div>
          ` : `
            <div class="text-center mt-4 pt-4 border-t-2 border-dashed border-gray-300">
              <p class="text-xs text-gray-400">⚠️ 云端同步失败，无法分享</p>
            </div>
          `}

          <!-- Delete Button -->
          <div class="text-center mt-4">
            <button class="text-red-500 text-sm underline" onclick="deleteRecord(${record.id})">🗑️ 删除此记录</button>
          </div>
        </div>
      `;

      modal.classList.remove('hidden');

      // Trigger stamp animations for already-approved/rejected items
      setTimeout(() => {
        detail.querySelectorAll('.stamp').forEach(s => {
          s.style.animation = 'none';
          void s.offsetWidth;
          s.style.animation = '';
        });
      }, 50);
    }

    function closeModal() {
      document.getElementById('receipt-modal').classList.add('hidden');
      renderHistory();
    }

    // ===== Approval Action =====
    function submitApproval(id, friend, action) {
      const records = getRecords();
      const record = records.find(r => r.id === id);
      if (!record) return;

      // Get comment from textarea
      const commentTextarea = document.getElementById(`comment-${friend}`);
      const comment = commentTextarea ? commentTextarea.value.trim() : '';

      record.approvals[friend].status = action;
      record.approvals[friend].comment = comment;
      saveRecords(records);

      // Play sound
      if (action === 'approved') {
        playStampSound();
      } else {
        playRejectSound();
        playTearSound();
      }

      // Shake animation on the approval section
      const section = document.getElementById(`approval-${friend.toLowerCase()}`);
      if (section) {
        section.classList.add('shake');
        setTimeout(() => section.classList.remove('shake'), 500);
      }

      // Check if we need to trigger court or final status
      const aStatus = record.approvals.A.status;
      const bStatus = record.approvals.B.status;

      // Count approvals and rejections
      const approvals = [];
      const rejections = [];
      if (aStatus === 'approved') approvals.push('A');
      if (aStatus === 'rejected') rejections.push('A');
      if (bStatus === 'approved') approvals.push('B');
      if (bStatus === 'rejected') rejections.push('B');

      // If both have voted and it's 1:1, trigger court
      if (approvals.length === 1 && rejections.length === 1 && !record.courtResult) {
        const courtResult = judgeResult(approvals, rejections);
        record.courtResult = courtResult;
        saveRecords(records);

        // Show court overlay
        setTimeout(() => {
          showCourt(courtResult, id);
          if (courtResult.status === 'approved') {
            setTimeout(() => {
              playSuccessSound();
              spawnConfetti();
              spawnCanvasCoins(record.amount);
            }, 300);
          }
        }, 300);
      } else {
        // Normal flow
        const newStatus = getOverallStatus(record);
        if (newStatus === 'approved') {
          setTimeout(() => {
            playSuccessSound();
            spawnConfetti();
            spawnCanvasCoins(record.amount);
          }, 300);
        }
        showReceiptDetail(id);
      }
    }

    // ===== Delete Record =====
    function deleteRecord(id) {
      if (!confirm('确定要删除这条审批记录吗？')) return;
      const records = getRecords().filter(r => r.id !== id);
      saveRecords(records);
      closeModal();
      renderHistory();
    }

    // ===== Utility =====
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ===== Share Function =====
    function shareRecord(cloudId) {
      if (!cloudId) {
        alert('该记录未同步到云端，无法分享');
        return;
      }
      const shareUrl = `${location.origin}${location.pathname}?id=${cloudId}`;
      
      // 创建分享弹窗
      const overlay = document.createElement('div');
      overlay.className = 'court-overlay';
      overlay.innerHTML = `
        <div class="court-card" style="max-width: 400px;">
          <h2 class="text-2xl font-bold mb-4">📤 分享审批链接</h2>
          <p class="text-sm text-gray-600 mb-2">复制以下链接发给朋友：</p>
          <div class="share-link-box">${shareUrl}</div>
          <div class="flex gap-2 mt-4">
            <button class="submit-btn flex-1" onclick="copyShareLink('${shareUrl}')">📋 复制链接</button>
            <button class="submit-btn flex-1" style="background:#6b7280" onclick="this.closest('.court-overlay').remove()">关闭</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    function copyShareLink(url) {
      navigator.clipboard.writeText(url).then(() => {
        alert('链接已复制到剪贴板！');
      }).catch(() => {
        // 降级方案
        const input = document.createElement('input');
        input.value = url;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        alert('链接已复制到剪贴板！');
      });
    }

    // ===== Settings Button =====
    function showSettings() {
      const config = getSupabaseConfig();
      const overlay = document.createElement('div');
      overlay.className = 'court-overlay';
      overlay.innerHTML = `
        <div class="court-card" style="max-width: 450px;">
          <h2 class="text-2xl font-bold mb-4">⚙️ 云端设置</h2>
          <div class="mb-4">
            <label class="block mb-1 text-lg">🔗 Supabase URL</label>
            <input type="text" id="settings-url" class="form-input" value="${config?.url || ''}" />
          </div>
          <div class="mb-4">
            <label class="block mb-1 text-lg">🔑 Supabase Anon Key</label>
            <input type="text" id="settings-key" class="form-input" value="${config?.key || ''}" />
          </div>
          <div class="flex gap-2">
            <button class="submit-btn flex-1" onclick="updateSettings()">💾 保存</button>
            <button class="submit-btn flex-1" style="background:#ef4444" onclick="clearSettings()">🗑️ 清除配置</button>
            <button class="submit-btn flex-1" style="background:#6b7280" onclick="this.closest('.court-overlay').remove()">取消</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    function updateSettings() {
      const url = document.getElementById('settings-url').value.trim();
      const key = document.getElementById('settings-key').value.trim();
      if (!url || !key) {
        alert('请填写完整的 URL 和 Key');
        return;
      }
      saveSupabaseConfig(url, key);
      if (initSupabase(url, key)) {
        alert('配置已更新！');
        location.reload();
      } else {
        alert('配置更新失败');
      }
    }

    function clearSettings() {
      if (confirm('确定要清除云端配置吗？清除后将无法使用分享功能。')) {
        localStorage.removeItem('supabase_config');
        location.reload();
      }
    }

    // ===== 图片上传预览 =====
    function initImageUpload() {
      const fileInput = document.getElementById('product-image');
      const preview = document.getElementById('image-upload-preview');
      const previewImg = document.getElementById('preview-img');
      
      if (fileInput) {
        fileInput.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (event) => {
              previewImg.src = event.target.result;
              preview.style.display = 'block';
              parsedImageData = event.target.result;
            };
            reader.readAsDataURL(file);
          }
        });
      }
    }

    // ===== Init =====
    // 检查是否是分享链接
    checkShareLink();
    
    // 如果不是分享链接且已配置，显示正常界面
    if (sbClient && !new URLSearchParams(window.location.search).get('id')) {
      document.getElementById('receipt-no').textContent = getNextNo();
      initImageUpload();
      
      // 添加设置按钮到表单底部
      const form = document.getElementById('approval-form');
      if (form) {
        const settingsBtn = document.createElement('button');
        settingsBtn.type = 'button';
        settingsBtn.innerHTML = '⚙️ 云端设置';
        settingsBtn.className = 'text-gray-500 text-sm underline mt-4';
        settingsBtn.style.cssText = 'display:block;margin:1rem auto 0;background:none;border:none;cursor:pointer;';
        settingsBtn.onclick = showSettings;
        form.appendChild(settingsBtn);
      }
    } else if (!sbClient && !new URLSearchParams(window.location.search).get('id')) {
      // 未配置且不是分享链接，显示配置面板
      showConfigPanel();
    }
  </script>
</body>
</html>
